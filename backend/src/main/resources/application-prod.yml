spring:
  config:
    activate:
      on-profile: prod
  flyway:
    # ADR-009: schema bootstrap is external (mvn flyway:migrate as APP_OWNER
    # + deploy_packages.sql). Never auto-migrate from the runtime artifact:
    # classpath:db/migration does not exist in the image.
    enabled: false

oracle:
  url: ${ORACLE_URL}
  username: ${ORACLE_USER}
  password: ${ORACLE_PASSWORD}
  ucp:
    initial-pool-size: 10
    min-pool-size: 10
    max-pool-size: 50
    connection-wait-timeout: 5
    inactive-connection-timeout: 120
    abandoned-connection-timeout: 60
    validate-connection-on-borrow: true

# C1: prod credentials have NO defaults — startup fails fast when
# APP_ADMIN_PASSWORD / APP_OPERATOR_PASSWORD are missing. Weak values
# (missing/short/<12/"changeme") additionally abort via
# CredentialHardeningCheck.
app:
  security:
    admin:
      password: ${APP_ADMIN_PASSWORD}
    operator:
      password: ${APP_OPERATOR_PASSWORD}
    tenancy:
      # C4: non-admin users are bound to these tenant codes (ROLE_ADMIN: any).
      operator-allowed-tenants: ${APP_OPERATOR_TENANTS:ACME}

management:
  server:
    port: 8081
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      # FT-001: db belongs to the readiness group (not liveness).
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: WARN
    com.enterpriseorders: INFO
