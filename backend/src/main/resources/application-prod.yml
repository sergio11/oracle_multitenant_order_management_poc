spring:
  config:
    activate:
      on-profile: prod
  flyway:
    # Schema bootstrap is external (mvn flyway:migrate as APP_OWNER
    # + deploy_packages.sql). Never auto-migrate from the runtime artifact:
    # classpath:db/migration does not exist in the image.
    enabled: false

oracle:
  url: ${ORACLE_URL}
  # Require an explicit second service so enterprise tenants cannot
  # silently fall back to the shared PDB and bypass physical isolation.
  dedicated-url: ${ORACLE_DEDICATED_URL}
  username: ${ORACLE_USER}
  password: ${ORACLE_PASSWORD}
  ucp:
    initial-pool-size: 10
    min-pool-size: 10
    max-pool-size: 50
    connection-wait-timeout: 5
    inactive-connection-timeout: 120
    abandoned-connection-timeout: 60
    validate-connection-on-borrow: true

# C1: prod credentials have NO defaults — startup fails fast when
# APP_ADMIN_PASSWORD / APP_OPERATOR_PASSWORD are missing. Weak values
# (missing/short/<12/"changeme") additionally abort via
# CredentialHardeningCheck.
app:
  maintenance:
    # Cross-tenant relay/retention are operational in prod.
    enabled: ${APP_MAINTENANCE_ENABLED:true}
    initial-delay-ms: 20000
    outbox-interval-ms: 30000
    outbox-batch-size: 100
    idempotency-purge-interval-ms: 3600000
  idempotency:
    retention-days: ${APP_IDEMPOTENCY_RETENTION_DAYS:30}
  security:
    admin:
      password: ${APP_ADMIN_PASSWORD}
    operator:
      password: ${APP_OPERATOR_PASSWORD}
    tenancy:
      # C4: non-admin users are bound to these tenant codes (ROLE_ADMIN: any).
      operator-allowed-tenants: ${APP_OPERATOR_TENANTS:ACME}

management:
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      # FT-001: db belongs to the readiness group (not liveness).
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: WARN
    com.enterpriseorders: INFO
