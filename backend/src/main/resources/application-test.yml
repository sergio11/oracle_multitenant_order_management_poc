spring:
  config:
    activate:
      on-profile: test

oracle:
  url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/pdb_oltp}
  username: ${ORACLE_USER:APP_RUNTIME}
  password: ${ORACLE_PASSWORD:ChangeMe123!}
  ucp:
    initial-pool-size: 2
    min-pool-size: 2
    max-pool-size: 10
    connection-wait-timeout: 15
    inactive-connection-timeout: 120
    validate-connection-on-borrow: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
