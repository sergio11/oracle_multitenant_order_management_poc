spring:
  application:
    name: enterprise-order-platform
  profiles:
    active: local
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSS''Z''}","level":"%p","service":"${spring.application.name}","thread":"%t","correlationId":"%X{correlationId}","tenantId":"%X{tenantId}","logger":"%c","message":"%m"}%n'

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    enabled: false
    locations: classpath:db/migration

oracle:
  url: ${ORACLE_URL:jdbc:oracle:thin:@(DESCRIPTION=(CONNECT_TIMEOUT=5)(RETRY_COUNT=3)(RETRY_DELAY=2)(ADDRESS_LIST=(ADDRESS=(PROTOCOL=TCP)(HOST=localhost)(PORT=1521)))(CONNECT_DATA=(SERVICE_NAME=pdb_oltp)))}
  dedicated-url: ${ORACLE_DEDICATED_URL:jdbc:oracle:thin:@localhost:1521/pdb_corp}
  username: ${ORACLE_USER:APP_RUNTIME}
  password: ${ORACLE_PASSWORD}
  ucp:
    initial-pool-size: 3
    min-pool-size: 3
    max-pool-size: 10
    dedicated:
      # Pool for the dedicated PDB (PDB_CORP). Deliberately lazy: connections
      # are only opened when an ENTERPRISE tenant is routed there, so the
      # service starts without the dedicated PDB and fails closed on it
      # (fail-closed, never a silent fallback to the shared pool).
      initial-pool-size: 0
      min-pool-size: 0
      max-pool-size: 5
    connection-wait-timeout: 30
    inactive-connection-timeout: 300
    abandoned-connection-timeout: 60
    connection-validation-timeout: 10
    validate-connection-on-borrow: true

app:
  reporting:
    # Seconds between MV refreshes (single-JVM; see RefreshRateLimiter).
    refresh-cooldown-seconds: 60
  security:
    admin:
      password: ${APP_ADMIN_PASSWORD:changeme}
    operator:
      password: ${APP_OPERATOR_PASSWORD:changeme}
    tenancy:
      # C4: role-level binding - non-admin principals may enter these tenant
      # codes (comma separated). ROLE_ADMIN may access any tenant (enforced
      # in TenantContextFilter). Per-user mapping is out of POC scope.
      operator-allowed-tenants: ${APP_OPERATOR_TENANTS:ACME}

management:
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      # FT-001: db belongs to the readiness group (not liveness).
      # DB outage -> pod Unready (traffic shed, controlled 503s) but
      # NOT restarted. Liveness stays app-only by default.
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}