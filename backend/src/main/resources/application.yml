spring:
  application:
    name: enterprise-order-platform
  profiles:
    active: local
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSS''Z''}","level":"%p","service":"${spring.application.name}","thread":"%t","correlationId":"%X{correlationId}","tenantId":"%X{tenantId}","logger":"%c","message":"%m"}%n'

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    enabled: false
    locations: classpath:db/migration

oracle:
  url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/pdb_oltp}
  username: ${ORACLE_USER:APP_RUNTIME}
  password: ${ORACLE_PASSWORD}
  ucp:
    initial-pool-size: 5
    min-pool-size: 5
    max-pool-size: 20
    connection-wait-timeout: 30
    inactive-connection-timeout: 300
    validate-connection-on-borrow: true

management:
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}