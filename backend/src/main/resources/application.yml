spring:
  application:
    name: enterprise-order-platform
  profiles:
    active: local

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    # No JPA (SRS 50). JDBC + Oracle UCP configured programmatically
    # in OracleUcpConfig.
  flyway:
    enabled: false
    locations: classpath:db/migration

oracle:
  url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/pdb_oltp}
  username: ${ORACLE_USER:APP_RUNTIME}
  password: ${ORACLE_PASSWORD:ChangeMe123!}
  ucp:
    initial-pool-size: 5
    min-pool-size: 5
    max-pool-size: 20
    connection-wait-timeout: 30
    inactive-connection-timeout: 300
    validate-connection-on-borrow: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
</content>
