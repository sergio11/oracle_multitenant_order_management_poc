spring:
  application:
    name: enterprise-order-platform
  profiles:
    active: local
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSS''Z''}","level":"%p","service":"${spring.application.name}","thread":"%t","correlationId":"%X{correlationId}","tenantId":"%X{tenantId}","logger":"%c","message":"%m"}%n'

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    enabled: false
    locations: classpath:db/migration

oracle:
  url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/pdb_oltp}
  username: ${ORACLE_USER:APP_RUNTIME}
  password: ${ORACLE_PASSWORD}
  ucp:
    initial-pool-size: 5
    min-pool-size: 5
    max-pool-size: 20
    connection-wait-timeout: 30
    inactive-connection-timeout: 300
    abandoned-connection-timeout: 60
    connection-validation-timeout: 10
    validate-connection-on-borrow: true

app:
  reporting:
    # Seconds between MV refreshes (single-JVM; see RefreshRateLimiter).
    refresh-cooldown-seconds: 60
  security:
    admin:
      password: ${APP_ADMIN_PASSWORD:changeme}
    operator:
      password: ${APP_OPERATOR_PASSWORD:changeme}
    tenancy:
      # C4: non-admin users are bound to these tenant codes (comma separated).
      # ROLE_ADMIN may access any tenant (enforced in TenantContextFilter).
      operator-allowed-tenants: ${APP_OPERATOR_TENANTS:ACME}

management:
  endpoints:
    web:
      base-path: /internal
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      # FT-001: db belongs to the readiness group (not liveness).
      # DB outage -> pod Unready (traffic shed, controlled 503s) but
      # NOT restarted. Liveness stays app-only by default.
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}