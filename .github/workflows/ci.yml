name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # -----------------------------------------------------------------------
  build-and-test:
  # -----------------------------------------------------------------------
  runs-on: ubuntu-latest

  services:
    oracle:
      image: gvenzl/oracle-free:23-slim
      env:
        ORACLE_PASSWORD: ChangeMe123!
        APP_USER: app_owner
        APP_USER_PASSWORD: ChangeMe123!
      ports:
        - 1521:1521
      options: >-
        --health-cmd healthcheck-oracle
        --health-interval 15s
        --health-timeout 5s
        --health-retries 60

    # App users are created automatically by the gvenzl image via
    # ORACLE_PASSWORD / APP_USER env vars on first start.
    # Database setup (migrations, packages, VPD) is applied via the
    # init script during container boot.

  steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: maven

    - name: Build and run unit tests
      run: mvn -f backend/pom.xml -B test

    - name: Run Docker image build (validation)
      run: |
        docker build -t backend-test:ci backend/

  # -----------------------------------------------------------------------
  publish:
  # -----------------------------------------------------------------------
  needs: build-and-test
  if: github.ref == 'refs/heads/main'
  runs-on: ubuntu-latest

  steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=sha-
          type=ref,event=branch
          type=ref,event=pr

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
