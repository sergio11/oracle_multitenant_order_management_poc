# Podman Compose for local Oracle Lab (POC)
#
# Reproduces the local MVP:
#   Spring Boot (external) -> Oracle Free -> CDB (FREE) -> PDB_OLTP
#
# Image: gvenzl/oracle-free:23-slim (NOT container-registry.oracle.com)
# Supported env vars used here:
#   ORACLE_PASSWORD : mandatory SYS/SYSTEM password (first start)
#   ORACLE_DATABASE : creates custom PDB "PDB_OLTP" (matches backend
#                     jdbc:oracle:thin:@localhost:1521/pdb_oltp)
#   ORACLE_SID / ORACLE_PDB are NOT supported by gvenzl images - do not set.
# Init scripts must be mounted at /container-entrypoint-initdb.d
# (executed as SYS after DB setup, first start only).
# The image provides its own healthcheck.sh.
#
# Usage:
#   cp .env.example .env   # fill in secrets locally
#   podman compose up -d
#
# IMPORTANT: This is the LOCAL lab. RAC / ASM / Data Guard / GoldenGate
# remain enterprise target architecture (see SRS §86-87).

name: poc-oracle

networks:
  poc_oracle_net:
    name: poc_oracle_net
    driver: bridge

volumes:
  oracle-data:
    name: poc_oracle_data

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: poc-oracle
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      ORACLE_DATABASE: ${ORACLE_DATABASE:-PDB_OLTP}
    ports:
      # Loopback-only publish: the listener must not be reachable from
      # other hosts on the LAN. Host tools (sqlplus, mvn flyway, the
      # backend on the host) connect via localhost:1521; containers on
      # poc_oracle_net talk to the container IP directly and never use
      # this published port.
      - "127.0.0.1:${ORACLE_LISTENER_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      # Bind-mount local scripts so gvenzl/oracle-free executes them on
      # first startup as SYS (creates APP_OWNER / APP_RUNTIME /
      # APP_REPORTING inside PDB_OLTP - see scripts/01-init-db.sql).
      - ./scripts:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      # slim image init (DB create + PDB + scripts) can take several minutes
      start_period: 180s
    # mem_limit is honored by podman-compose; deploy.resources is the
    # compose/swarm equivalent - keep both.
    mem_limit: 4g
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    networks:
      - poc_oracle_net
