apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oracle
  namespace: poc-oracle
  labels:
    app: oracle
    app.kubernetes.io/part-of: enterprise-order-platform
spec:
  serviceName: oracle
  replicas: 1
  selector:
    matchLabels:
      app: oracle
  template:
    metadata:
      labels:
        app: oracle
    spec:
      # Oracle pod is deliberately NOT hardened beyond this: the
      # gvenzl/oracle-free entrypoint runs as root and needs it for
      # first-boot DB creation (chown/setuid), so runAsNonRoot /
      # readOnlyRootFilesystem / capability drops would break bring-up.
      # Baseline PSA is enforced at namespace level, exposure is covered
      # by NetworkPolicy (see network-policies.yaml) and the image needs
      # no Kubernetes API access at all.
      automountServiceAccountToken: false
      containers:
        - name: oracle
          image: gvenzl/oracle-free:23-slim
          imagePullPolicy: IfNotPresent
          ports:
            - name: tns
              containerPort: 1521
          env:
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poc-oracle-secrets
                  key: ORACLE_PASSWORD
            - name: ORACLE_DATABASE
              value: PDB_OLTP
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: oracle-data
              mountPath: /opt/oracle/oradata
            - name: oracle-init
              mountPath: /container-entrypoint-initdb.d
              readOnly: true
          # First boot (DB create + PDB + init scripts) can take several
          # minutes. Measured on this lab host (4 vCPU Podman VM): ~10 min
          # from pod start to OPEN, which is exactly the old budget
          # (40 x 15s). A timeout here is not a slow pod, it is a killed
          # container in the middle of database creation, leaving a
          # half-built datafile set on the PVC. Budget 20 min instead:
          # the probe only gates startup, so a generous threshold costs
          # nothing on a healthy boot.
          startupProbe:
            exec:
              command: ["healthcheck.sh"]
            periodSeconds: 15
            failureThreshold: 80
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["healthcheck.sh"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["healthcheck.sh"]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: oracle-init
          configMap:
            name: oracle-init-scripts
  volumeClaimTemplates:
    - metadata:
        name: oracle-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
