# QA manifests for kind + Podman (applied by `rake qa:deploy`).
# Secrets and the Oracle init ConfigMap are generated by the Rakefile
# from infrastructure/podman/.env (and scripts/) - not committed here.
# NOTE: namespace.yaml is deliberately NOT listed here: it is applied by
# `rake qa:deploy` and must never be deleted by `rake qa:down` (removing
# the Namespace would cascade-delete the Oracle PVC and all its data).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: poc-oracle
resources:
  - network-policies.yaml
  - oracle/statefulset.yaml
  - oracle/service.yaml
  - backend/deployment.yaml
  - backend/service.yaml
