apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: poc-oracle
  labels:
    app: backend
    app.kubernetes.io/part-of: enterprise-order-platform
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      # Mapped to host 8080 by kind-config extraPortMappings
      nodePort: 30080
