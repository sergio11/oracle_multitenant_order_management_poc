apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: poc-qa
  labels:
    app: backend
    app.kubernetes.io/part-of: enterprise-order-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Backend never talks to the Kubernetes API (no cloud-k8s clients).
      automountServiceAccountToken: false
      # Restricted-profile pod security context: numeric non-root matching
      # the Dockerfile's `USER 65532:65532`, RuntimeDefault seccomp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spring Boot exits cleanly on SIGTERM; 30s covers in-flight requests.
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          # Built by `rake qa:image:build` and loaded by `rake qa:image:load`.
          # Must match the exact repo name in the kind node
          # (podman prefixes local builds with localhost/).
          image: localhost/enterprise-orders-qa:0.0.1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
            - name: ORACLE_URL
              value: jdbc:oracle:thin:@oracle:1521/pdb_oltp
            - name: ORACLE_USER
              value: APP_RUNTIME
            - name: ORACLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poc-qa-secrets
                  key: APP_RUNTIME_PWD
            - name: APP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poc-qa-secrets
                  key: APP_ADMIN_PASSWORD
            - name: APP_OPERATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poc-qa-secrets
                  key: APP_OPERATOR_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # Only writable path: JVM/Tomcat/Multipart temp files
            # (java.io.tmpdir=/tmp) - root FS stays read-only.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # NOTE: split availability groups (Boot 3.3). Readiness includes
          # the DB indicator -> pod goes Unready (not restarted) on DB
          # outage (FT-001). Liveness is app-only -> a DB outage must NOT
          # restart the pod (restart fixes nothing and drops warmup).
          # startupProbe uses the app-only liveness endpoint with a
          # generous budget so a slow first boot (JVM + class load, Oracle
          # still coming up) is not killed before liveness/readiness start.
          startupProbe:
            httpGet:
              path: /internal/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /internal/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /internal/health/liveness
              port: http
            initialDelaySeconds: 40
            periodSeconds: 30
            failureThreshold: 6
      volumes:
        - name: tmp
          emptyDir: {}
